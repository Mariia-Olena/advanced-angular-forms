<div class="label">{{ label }}</div>
<div class="control" cdkOverlayOrigin #origin="cdkOverlayOrigin">
  <ng-container [ngSwitch]="searchable && isOpen">
    <input
      #input
      *ngSwitchCase="true"
      (input)="onHandleInput($event)"
      placeholder="Start typing..."
      type="text"
      class="select-search"
    />
    <span *ngSwitchCase="false" class="selected-value" [ngClass]="{ empty: !value }">
      {{ displayValue || "Nothing is selected..." }}
    </span>
  </ng-container>
  <button *ngIf="value" (click)="clearSelection($event)" class="clear-button">clear</button>
  <span class="drop-down-icon">👇</span>
</div>

<ng-template
  cdkConnectedOverlay
  cdkConnectedOverlayHasBackdrop
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="isOpen"
  [cdkConnectedOverlayOffsetY]="8"
  [cdkConnectedOverlayOffsetX]="-11"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="close()"
  (detach)="close()"
>
  <div [@dropDown] (@dropDown.done)="onPanelAnimationDone($event)" class="panel">
    <ng-content></ng-content>
  </div>
</ng-template>
